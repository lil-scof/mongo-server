name: MongoDB Replica Set Deployment
on:
  push:
    branches:
      - develop

env:
  MONGODB_NAMESPACE: scof-dev
  VERSION: 0.1.0
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install kubectl
      run: |
        sudo apt-get update
        sudo apt-get install -y curl ca-certificates gettext-base
        curl -sSL https://storage.googleapis.com/kubernetes-release/release/stable.txt -o /tmp/kver
        KVER=$(cat /tmp/kver)
        curl -sSL -o kubectl https://storage.googleapis.com/kubernetes-release/release/${KVER}/bin/linux/amd64/kubectl
        chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl
        kubectl version --client=true

    - name: Install OpenVPN
      run: |
        sudo apt-get install -y openvpn iproute2

    - name: Write OVPN config from secret
      run: |
        printf "%s\n" "${{ secrets.OVPN_FILE }}" > vpn.ovpn

    - name: Start OpenVPN (daemon) and wait
      run: |
        sudo openvpn --config vpn.ovpn --daemon --log-append "$(pwd)/vpn.log" --writepid vpn.pid
        echo "OpenVPN started"
        for i in {1..30}; do
          if sudo grep -q "Initialization Sequence Completed" vpn.log; then
            break
          fi
          sleep 2
        done
    
    - name: Write kubeconfig from secret (raw)
      run: |
        printf "%s" "${{ secrets.KUBECONFIG }}" > kubeconfig
        chmod 600 kubeconfig
        grep -q '^apiVersion:' kubeconfig || { echo "::error::kubeconfig looks invalid"; exit 1; }
  
    - name: Deployment to K8S (Dev)
      env:
        KUBECONFIG: kubeconfig
      run: |
        # Apply resources without deleting PVCs to preserve data
        kubectl apply -f k8s_resources/dev/service-headless.yaml
        kubectl apply -f k8s_resources/dev/statefulset.yaml
        kubectl apply -f k8s_resources/dev/service-primary.yaml

    - name: Ensure MongoDB admin user
      env:
        KUBECONFIG: kubeconfig
      run: |
        # Create/ensure admin user exists (idempotent)
        kubectl apply -f k8s_resources/dev/job-ensure-admin.yaml
        kubectl -n scof-dev wait --for=condition=complete job/mongodb-ensure-admin --timeout=180s || true

    - name: Prefer mongodb-0 as PRIMARY (priority + optional stepUp)
      env:
        KUBECONFIG: kubeconfig
      run: |
        set -e
        echo "Fetching credentials..."
        USER=$(kubectl -n scof-dev get secret scof-dev-secret -o jsonpath='{.data.MONGO_INITDB_ROOT_USERNAME}' | base64 -d)
        PASS=$(kubectl -n scof-dev get secret scof-dev-secret -o jsonpath='{.data.MONGO_INITDB_ROOT_PASSWORD}' | base64 -d)

        echo "Checking replica set status..."
        RS_OK=$(kubectl -n scof-dev exec mongodb-0 -- bash -lc "mongosh -u '$USER' -p '$PASS' --authenticationDatabase admin --quiet --eval 'try{rs.status().ok}catch(e){0}'" || echo 0)
        if [ "$RS_OK" != "1" ]; then
          echo "Replica set not initialized yet; skipping priority/stepUp"
          exit 0
        fi

        echo "Applying preferred priorities (0>1=2)..."
        kubectl -n scof-dev exec mongodb-0 -- bash -lc "mongosh -u '$USER' -p '$PASS' --authenticationDatabase admin --quiet --eval \"cfg=rs.conf(); cfg.members=[{ _id:0, host:'mongodb-0.mongodb-headless.scof-dev.svc.cluster.local:27017', priority:2 }, { _id:1, host:'mongodb-1.mongodb-headless.scof-dev.svc.cluster.local:27017', priority:1 }, { _id:2, host:'mongodb-2.mongodb-headless.scof-dev.svc.cluster.local:27017', priority:1 }]; rs.reconfig(cfg,{force:true})\"" || true

        echo "Attempting stepUp on mongodb-0..."
        kubectl -n scof-dev exec mongodb-0 -- bash -lc "mongosh -u '$USER' -p '$PASS' --authenticationDatabase admin --quiet --eval \"db.adminCommand({replSetStepUp:1})\"" || true

    - name: Notify to Slack (dev)
      uses: slackapi/slack-github-action@v1.19.0
      with:
        payload-file-path: "./assets/slack-payload/deploy-dev.json"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_HOOK_BOT_SCOF_DEVOPS }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
