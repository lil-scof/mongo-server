apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: scof-dev
spec:
  serviceName: mongodb-headless
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      # 1) keyfile 권한을 맞춰줄 initContainer
      initContainers:
      - name: fix-key-perms
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          set -e
          # secret로 온 파일을 우리가 쓸 위치로 복사
          cp /secret/mongodb.key /workdir/mongodb.key
          # mongo 컨테이너가 쓰는 uid/gid = 999 라고 가정
          chown 999:999 /workdir/mongodb.key
          chmod 400 /workdir/mongodb.key
        volumeMounts:
        - name: mongodb-key
          mountPath: /secret
          readOnly: true
        - name: keyfile
          mountPath: /workdir

      containers:
      - name: mongo
        image: mongo:latest
        # 2) entrypoint 살리고 우리가 옵션만 얹기
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            docker-entrypoint.sh mongod \
              --replSet "${REPLICA_SET_NAME}" \
              --keyFile /etc/mongodb.key/mongodb.key \
              --bind_ip_all
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: scof-dev-secret
              key: MONGO_INITDB_ROOT_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: scof-dev-secret
              key: MONGO_INITDB_ROOT_PASSWORD
        - name: REPLICA_SET_NAME
          valueFrom:
            configMapKeyRef:
              name: scof-dev-config
              key: MONGODB_REPLICA_SET_NAME
        volumeMounts:
        - name: data
          mountPath: /data/db
        # 3) initContainer가 만들어준 keyfile을 여기로 마운트
        - name: keyfile
          mountPath: /etc/mongodb.key
          readOnly: true
        # 4) 프로브는 일단 조용하게
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5

      # secret 자체를 직접 쓰는 볼륨 (initContainer가 여기서 읽어서 복사)
      volumes:
      - name: mongodb-key
        secret:
          secretName: scof-dev-secret
          items:
          - key: MONGODB_KEY
            path: mongodb.key
          # 여기서 0400(root:root) 로 와도 괜찮음. 우리가 복사해서 chown할 거라.
          defaultMode: 256

      # initContainer가 chown/chmod 한 파일을 담아둘 emptyDir
      - name: keyfile
        emptyDir: {}

  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: scof-dev-sc
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi